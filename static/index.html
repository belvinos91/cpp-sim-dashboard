<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C++ Simulation Dashboard</title>
<link rel="stylesheet" href="/static/vendor/codemirror.css">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1f2328; --muted: #6b6f76;
    --line: #dcd9d2; --accent: #9b003a; --accent-ink: #ffffff;
    --ok: #1a7f37; --err: #b42318; --code-bg: #fbfaf8; --console: #15171a; --console-ink: #e6e6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111315; --panel: #1a1d20; --ink: #e8e6e3; --muted: #9aa0a6;
      --line: #2c3035; --accent: #e0577f; --accent-ink: #111315;
      --ok: #4ac26b; --err: #ff7b72; --code-bg: #15181b; --console: #0c0d0f; --console-ink: #e6e6e6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; font-weight: 650; }
  header .compiler { color: var(--muted); font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           display: flex; flex-direction: column; min-width: 0; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
             padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .toolbar label { font-size: 13px; color: var(--muted); }
  select, input[type=text] { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 6px;
           border: 1px solid var(--line); background: var(--code-bg); color: var(--ink); }
  input[type=text] { width: 140px; font-family: ui-monospace, Consolas, monospace; }
  button.run { margin-left: auto; font: inherit; font-weight: 600; padding: 7px 16px; border: 0;
               border-radius: 6px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button.run:disabled { opacity: 0.6; cursor: progress; }
  .hint { font-size: 12px; color: var(--muted); padding: 6px 12px; border-top: 1px solid var(--line); }
  .CodeMirror { height: 68vh; font-size: 14px; font-family: ui-monospace, Consolas, "Courier New", monospace;
                background: var(--code-bg); color: var(--ink); border-radius: 0 0 10px 10px; }
  .CodeMirror-gutters { background: var(--code-bg); border-right: 1px solid var(--line); }
  .CodeMirror-cursor { border-left-color: var(--ink); }
  @media (max-width: 900px) { .CodeMirror { height: 50vh; } }
  .status { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); min-height: 42px; }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); }
  #plot { height: 38vh; min-height: 260px; }
  .empty { display: flex; align-items: center; justify-content: center; color: var(--muted);
           font-size: 14px; text-align: center; padding: 16px; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
                   padding: 8px 12px 0; }
  pre.console { margin: 8px 12px 12px; padding: 10px 12px; background: var(--console); color: var(--console-ink);
                border-radius: 8px; font: 13px/1.45 ui-monospace, Consolas, monospace;
                white-space: pre-wrap; word-break: break-word; max-height: 24vh; overflow: auto; }
  pre.console .err { color: #ff9b94; } pre.console .warn { color: #f2cc60; }
</style>
</head>
<body>
<header>
  <h1>C++ Simulation Dashboard</h1>
  <span class="compiler" id="compiler">checking compiler…</span>
</header>
<main>
  <section class="panel" aria-label="Code editor">
    <div class="toolbar">
      <label for="example">Example</label>
      <select id="example"></select>
      <label for="args">Arguments</label>
      <input type="text" id="args" placeholder="e.g. 2 40">
      <button class="run" id="run" title="Ctrl+Enter">Run ▶</button>
    </div>
    <textarea id="code"></textarea>
    <div class="hint">Write a file called <code>data.csv</code> (first row = column names, first column = x) and it is plotted automatically. A first column named <code>run</code> draws one line per run.</div>
  </section>
  <section class="panel" aria-label="Results">
    <div class="status" id="status">Press Run (or Ctrl+Enter) to compile and run.</div>
    <div id="plot" class="empty">The plot of data.csv appears here.</div>
    <div class="section-title">Output</div>
    <pre class="console" id="console">—</pre>
  </section>
</main>
<script src="/static/vendor/codemirror.js"></script>
<script src="/static/vendor/clike.js"></script>
<script src="/static/vendor/plotly.min.js"></script>
<script>
const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
  mode: 'text/x-c++src', lineNumbers: true, indentUnit: 4, matchBrackets: true,
  extraKeys: { 'Ctrl-Enter': run, 'Cmd-Enter': run, Tab: cm => cm.replaceSelection('    ') }
});
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));

async function loadExample(name) {
  const r = await fetch('/api/examples/' + encodeURIComponent(name));
  const j = await r.json();
  editor.setValue(j.code);
  try { localStorage.setItem('cppdash-example', name); } catch (e) {}
}

async function init() {
  fetch('/api/info').then(r => r.json()).then(j => $('compiler').textContent = j.compiler);
  const names = await (await fetch('/api/examples')).json();
  $('example').innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
  let start = names[0];
  try { const s = localStorage.getItem('cppdash-example'); if (names.includes(s)) start = s; } catch (e) {}
  $('example').value = start;
  await loadExample(start);
  $('example').addEventListener('change', e => loadExample(e.target.value));
  $('run').addEventListener('click', run);
}

function setStatus(text, cls) { $('status').textContent = text; $('status').className = 'status ' + (cls || ''); }

async function run() {
  $('run').disabled = true;
  setStatus('Compiling and running…');
  let res;
  try {
    const r = await fetch('/api/run', { method: 'POST', headers: {'Content-Type': 'application/json'},
                                       body: JSON.stringify({ code: editor.getValue(), args: $('args').value }) });
    res = await r.json();
  } catch (e) {
    setStatus('Could not reach the server. Is app.py still running?', 'err');
    $('run').disabled = false; return;
  }
  showResult(res);
  $('run').disabled = false;
}

function showResult(res) {
  let out = '';
  if (res.compiler) out += `<span class="${res.stage === 'compile' ? 'err' : 'warn'}">${esc(res.compiler)}</span>\n`;
  if (res.stdout) out += esc(res.stdout);
  if (res.stderr) out += `<span class="err">${esc(res.stderr)}</span>`;
  if (res.message) out += `<span class="err">${esc(res.message)}</span>`;
  $('console').innerHTML = out || '(no output)';

  if (res.stage === 'setup') setStatus(res.message, 'err');
  else if (res.stage === 'compile') setStatus('Compilation failed: see the compiler messages below.', 'err');
  else {
    const t = `compiled in ${res.compile_s.toFixed(2)} s, ran in ${res.run_s.toFixed(3)} s`;
    if (res.ok) setStatus(`Success: ${t}` + (res.data ? `, ${res.data.rows.length} data rows` : ''), 'ok');
    else setStatus(`Program stopped with an error (exit code ${res.exit_code ?? '?'})` + (res.run_s ? `: ${t}` : ''), 'err');
  }
  drawPlot(res.data);
}

function drawPlot(data) {
  const el = $('plot');
  if (!data || !data.rows.length) {
    Plotly.purge(el); el.className = 'empty';
    el.textContent = 'No data.csv was written, so there is nothing to plot.'; return;
  }
  el.className = ''; el.textContent = '';
  const h = data.header, rows = data.rows, traces = [];
  const type = rows.length > 5000 ? 'scattergl' : 'scatter';
  if (h[0].toLowerCase() === 'run') {
    const groups = new Map();
    rows.forEach(r => { if (!groups.has(r[0])) groups.set(r[0], []); groups.get(r[0]).push(r); });
    for (const [run, rs] of groups)
      for (let c = 2; c < h.length; c++)
        traces.push({ x: rs.map(r => r[1]), y: rs.map(r => r[c]), type, mode: 'lines',
                      name: (h.length > 3 ? h[c] + ' ' : '') + 'run ' + run, line: { width: 1.5 } });
  } else {
    for (let c = 1; c < h.length; c++)
      traces.push({ x: rows.map(r => r[0]), y: rows.map(r => r[c]), type, mode: 'lines',
                    name: h[c], line: { width: 2 } });
  }
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink').trim(), grid = css.getPropertyValue('--line').trim();
  const xName = h[0].toLowerCase() === 'run' ? h[1] : h[0];
  Plotly.react(el, traces, {
    margin: { l: 56, r: 16, t: 40, b: 48 }, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: ink, size: 13 }, showlegend: traces.length <= 12,
    xaxis: { title: { text: xName }, gridcolor: grid, zerolinecolor: grid },
    yaxis: { gridcolor: grid, zerolinecolor: grid }, legend: { orientation: 'h', x: 0, y: 1.02, yanchor: 'bottom' }
  }, { responsive: true, displaylogo: false });
}

init();
</script>
</body>
</html>
